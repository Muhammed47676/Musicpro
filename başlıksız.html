<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultimate Music Pro</title>
  <link rel="manifest" href="/manifest.json">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --spotify-green: #1DB954;
      --dark-bg: #121212;
      --dark-secondary: #181818;
      --dark-tertiary: #282828;
      --text-primary: #FFFFFF;
      --text-secondary: #B3B3B3;
    }
    
    body {
      font-family: 'Circular', sans-serif;
      background: var(--dark-bg);
      color: var(--text-primary);
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    
    /* Spotify benzeri arayüz */
    .main-container {
      display: grid;
      grid-template-columns: 240px 1fr;
      height: 100vh;
    }
    
    .sidebar {
      background: var(--dark-secondary);
      padding: 20px;
    }
    
    .player-container {
      background: linear-gradient(to bottom, #3a1a71, var(--dark-bg));
      padding: 20px;
      overflow-y: auto;
    }
    
    /* Diğer özel stiller... */
  </style>
</head>
<body>
  <div class="main-container">
    <!-- Sidebar Navigation -->
    <div class="sidebar">
      <h2 class="logo">MusicPro</h2>
      <div class="language-selector mb-4">
        <select class="form-select" id="languageSelect" onchange="changeLanguage(this.value)">
          <option value="tr">Türkçe</option>
          <option value="ku">Kurdî (Kürtçe)</option>
          <option value="en">English</option>
        </select>
      </div>
      
      <ul class="nav flex-column">
        <li class="nav-item">
          <a class="nav-link active" href="#" onclick="showSection('home')" id="navHome">
            <i class="bi bi-house-door"></i> Ana Sayfa
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" onclick="showSection('search')" id="navSearch">
            <i class="bi bi-search"></i> Ara
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" onclick="showSection('library')" id="navLibrary">
            <i class="bi bi-collection"></i> Kütüphane
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" onclick="showSection('playlists')" id="navPlaylists">
            <i class="bi bi-music-note-list"></i> Çalma Listeleri
          </a>
        </li>
      </ul>
      
      <div class="user-section mt-auto">
        <button class="btn btn-outline-light w-100 mb-2" onclick="loginWithSpotify()" id="loginBtn">
          Spotify ile Giriş
        </button>
        <button class="btn btn-outline-info w-100" onclick="installPWA()" id="installBtn">
          Uygulamayı Yükle
        </button>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="player-container">
      <!-- Home Section -->
      <div id="home" class="section active">
        <h3 id="welcomeHeader">Hoş Geldiniz</h3>
        <div class="row" id="featuredSongs"></div>
        <div class="row mt-4" id="recommendedSongs"></div>
      </div>
      
      <!-- Player Controls (Fixed at bottom) -->
      <div class="player-controls fixed-bottom">
        <div class="progress-container">
          <progress id="songProgress" value="0" max="100"></progress>
          <div class="time-display">
            <span id="currentTime">0:00</span>
            <span id="totalTime">0:00</span>
          </div>
        </div>
        
        <div class="player-buttons">
          <button class="btn btn-link" onclick="previousSong()">
            <i class="bi bi-skip-start-fill"></i>
          </button>
          <button class="btn btn-link" id="playPauseBtn" onclick="togglePlay()">
            <i class="bi bi-play-fill"></i>
          </button>
          <button class="btn btn-link" onclick="nextSong()">
            <i class="bi bi-skip-end-fill"></i>
          </button>
        </div>
        
        <div class="extra-controls">
          <button class="btn btn-link" onclick="toggleLyrics()" id="lyricsBtn">
            <i class="bi bi-mic"></i> Şarkı Sözleri
          </button>
          <div class="volume-control">
            <i class="bi bi-volume-up"></i>
            <input type="range" id="volumeSlider" min="0" max="100" value="70">
          </div>
          <button class="btn btn-link" onclick="toggleEQ()" id="eqBtn">
            <i class="bi bi-equalizer"></i> EQ
          </button>
        </div>
      </div>
      
      <!-- Lyrics Modal -->
      <div class="modal fade" id="lyricsModal">
        <div class="modal-dialog">
          <div class="modal-content bg-dark">
            <div class="modal-header">
              <h5 class="modal-title" id="lyricsTitle">Şarkı Sözleri</h5>
              <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="lyricsContent">
              Yükleniyor...
            </div>
          </div>
        </div>
      </div>
      
      <!-- EQ Settings Modal -->
      <div class="modal fade" id="eqModal">
        <div class="modal-dialog">
          <div class="modal-content bg-dark">
            <div class="modal-header">
              <h5 class="modal-title">Ekolayzer Ayarları</h5>
              <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <div class="eq-band">
                <label>Bass</label>
                <input type="range" class="eq-slider" id="bassSlider" min="-12" max="12" value="0">
              </div>
              <div class="eq-band">
                <label>Mid</label>
                <input type="range" class="eq-slider" id="midSlider" min="-12" max="12" value="0">
              </div>
              <div class="eq-band">
                <label>Treble</label>
                <input type="range" class="eq-slider" id="trebleSlider" min="-12" max="12" value="0">
              </div>
              <button class="btn btn-primary mt-3" onclick="saveEQSettings()">Ayarları Kaydet</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase, Tone.js (EQ için), Bootstrap Icons -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"></script>

  <script>
    // Firebase konfigürasyonu
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "your-app.firebaseapp.com",
      projectId: "your-app",
      storageBucket: "your-app.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef123456"
    };
    
    // Firebase'i başlat
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    
    // Çoklu dil desteği
    const translations = {
      tr: {
        welcome: "Hoş Geldiniz",
        searchPlaceholder: "Şarkı, sanatçı veya albüm ara...",
        play: "Çal",
        pause: "Durdur",
        lyrics: "Şarkı Sözleri",
        login: "Spotify ile Giriş",
        install: "Uygulamayı Yükle"
      },
      ku: {
        welcome: "Bi xêr hatî",
        searchPlaceholder: "Lêgerîn stran, hunermend an albûm...",
        play: "Lêxe",
        pause: "Rawestîne",
        lyrics: "Peyvên Stranê",
        login: "Têkeve bi Spotify",
        install: "Sepanê bar bike"
      },
      en: {
        welcome: "Welcome",
        searchPlaceholder: "Search for songs, artists or albums...",
        play: "Play",
        pause: "Pause",
        lyrics: "Lyrics",
        login: "Login with Spotify",
        install: "Install App"
      }
    };
    
    let currentLanguage = "tr";
    
    function changeLanguage(lang) {
      currentLanguage = lang;
      updateUIText();
    }
    
    function updateUIText() {
      document.getElementById("welcomeHeader").textContent = translations[currentLanguage].welcome;
      document.getElementById("loginBtn").textContent = translations[currentLanguage].login;
      document.getElementById("installBtn").textContent = translations[currentLanguage].install;
      // Diğer tüm arayüz metinlerini güncelle
    }
    
    // PWA yükleme desteği
    let deferredPrompt;
    
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBtn').style.display = 'block';
    });
    
    function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('Kullanıcı PWA yüklemesini kabul etti');
          }
          deferredPrompt = null;
        });
      }
    }
    
    // Müzik çalar işlevselliği
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    let currentTrack = null;
    let isPlaying = false;
    let currentPlaylist = [];
    let userPlaylists = [];
    
    // EQ ayarları
    const eqSettings = {
      bass: 0,
      mid: 0,
      treble: 0
    };
    
    // Uygulama başlatıldığında
    document.addEventListener('DOMContentLoaded', () => {
      initPlayer();
      loadUserData();
      checkAuthState();
    });
    
    function initPlayer() {
      // Tone.js ile EQ ayarları
      const equalizer = new Tone.EQ3({
        low: eqSettings.bass,
        mid: eqSettings.mid,
        high: eqSettings.treble
      }).toDestination();
      
      // Audio elementini bağla
      const player = new Tone.Player().connect(equalizer);
      
      // Diğer başlatma kodları...
    }
    
    // Spotify entegrasyonu
    function loginWithSpotify() {
      // Firebase üzerinden Spotify OAuth
      const provider = new firebase.auth.OAuthProvider('spotify.com');
      provider.addScope('user-read-private');
      provider.addScope('user-read-email');
      provider.addScope('user-library-read');
      
      firebase.auth().signInWithPopup(provider)
        .then((result) => {
          const user = result.user;
          console.log('Spotify ile giriş yapıldı:', user);
          fetchSpotifyLibrary(user);
        })
        .catch((error) => {
          console.error('Spotify giriş hatası:', error);
        });
    }
    
    async function fetchSpotifyLibrary(user) {
      // Kullanıcının Spotify kütüphanesini getir
      const token = await user.getIdToken();
      // API isteği yap...
    }
    
    // Karaoke/şarkı sözleri fonksiyonu
    async function fetchLyrics(artist, title) {
      try {
        const response = await fetch(`https://api.lyrics.ovh/v1/${encodeURIComponent(artist)}/${encodeURIComponent(title)}`);
        const data = await response.json();
        return data.lyrics || "Şarkı sözleri bulunamadı";
      } catch (error) {
        console.error("Şarkı sözleri alınırken hata:", error);
        return "Şarkı sözleri yüklenemedi";
      }
    }
    
    // Diğer müzik çalar fonksiyonları...
    function playSong(song) {
      // Şarkıyı çal
    }
    
    function togglePlay() {
      // Çal/Durdur
    }
    
    function nextSong() {
      // Sonraki şarkı
    }
    
    function previousSong() {
      // Önceki şarkı
    }
    
    function toggleLyrics() {
      // Şarkı sözlerini göster/gizle
    }
    
    function toggleEQ() {
      // EQ modalını göster
      const eqModal = new bootstrap.Modal(document.getElementById('eqModal'));
      eqModal.show();
    }
    
    function saveEQSettings() {
      // EQ ayarlarını kaydet
      eqSettings.bass = document.getElementById('bassSlider').value;
      eqSettings.mid = document.getElementById('midSlider').value;
      eqSettings.treble = document.getElementById('trebleSlider').value;
      
      // Tone.js EQ'yu güncelle
      equalizer.set({
        low: eqSettings.bass,
        mid: eqSettings.mid,
        high: eqSettings.treble
      });
      
      // Ayarları Firebase'e kaydet (kullanıcı giriş yapmışsa)
      if (firebase.auth().currentUser) {
        db.collection('users').doc(firebase.auth().currentUser.uid).update({
          eqSettings: eqSettings
        });
      }
    }
    
    // Service Worker kaydı (Çevrimdışı destek)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(registration => {
          console.log('ServiceWorker kaydı başarılı:', registration.scope);
        }, err => {
          console.log('ServiceWorker kaydı başarısız:', err);
        });
      });
    }
  </script>
</body>
</html>
